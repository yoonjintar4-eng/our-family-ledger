name: Deploy family ledger
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified application bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          endpoint = 'https://dlunkgfkmlxdzzoqstxz.supabase.co/rest/v1/rpc/family_ledger_public_build'
          request = Request(endpoint, data=b'{}', headers={
              'apikey': 'sb_publishable_ObMrKtWJ8g3PG6rbpJwCrQ_m0rP-FQp',
              'Content-Type': 'application/json',
          }, method='POST')
          with urlopen(request, timeout=30) as response:
              result = json.loads(response.read(2000000))
          archive = base64.b64decode(result['archive'], validate=True)
          expected = 'c9b181719f2e48c2cf756f6df822925127c3f5bdab8d7aba1674da1257d811eb'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError('Application bundle verification failed')
          names = {'index.html', 'app.css', 'ledger-view.js', 'cloud-runtime.js', 'vendor/zip-legacy.min.js', 'vendor/zip.LICENSE'}
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              if set(bundle.namelist()) != names:
                  raise RuntimeError('Unexpected application files')
              for name in names:
                  target = Path('_site') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(name))
          Path('_site/.nojekyll').write_text('')
          print('Verified application assets only; financial records are not bundled.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
