name: Deploy family ledger
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified application assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, base64
          from pathlib import Path
          from urllib.request import urlopen
          origin = 'https://our-family-ledger.yoonjintar0.chatgpt.site/'
          embedded_index = base64.b64decode('')
          expected = {
          'index.html': '81503cb5231279b3c201cf5fc43bc38ac8275ac1a01b3856301d4745d8a9a231',
          'app.css': '04b0d4f2ab2627cee970c496a7dd721fe6c4929ffab1da26b55f53ed3302c566',
          'ledger-view.js': 'd9cf48a6243b75998cc3c981f54105ca13e8332e02150cb4756cf51eb7ee2b14',
          'cloud-runtime.js': 'be00ffead0552f76774bd49d0521f8625ac7e6c88386ff6d00cdbfe3c4d47fa7',
          'vendor/zip-legacy.min.js': 'f33b9b002df919f908d571038f06f773722f8ec73b6e2e3b6937f1f28c7931b1',
          'vendor/zip.LICENSE': '1b7ebc8d7889ed25491484ab2b102370742ca6c0b26650a0c62cc2269b579b84',
          }
          for name, checksum in expected.items():
              if name == 'index.html':
                  content = embedded_index
              else:
                  with urlopen(origin + name, timeout=30) as response:
                      content = response.read(2000000)
              if hashlib.sha256(content).hexdigest() != checksum:
                  raise RuntimeError('Application asset verification failed: ' + name)
              target = Path('_site') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          Path('_site/.nojekyll').write_text('')
          print('Verified application assets only; financial records are not bundled.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
